name: Frontend Accessibility Scans

# Automated accessibility (axe) scans toward WCAG 2.1 Level AA (task 15.10,
# R37.5). These scans catch a machine-detectable subset of accessibility
# issues on key branded pages. Full WCAG 2.1 AA conformance additionally
# requires manual assistive-technology testing and expert review.

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  pull_request:
    paths:
      - "frontend/**"

jobs:
  a11y:
    name: axe accessibility scans
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility scans
        run: npm run test:a11y
