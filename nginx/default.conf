# ─── Wildcard reverse proxy for the multi-tenant platform ───────────────────
#
# ONE nginx entry point serves every host:
#   - apex / app host         (e.g. app.example.com, localhost)      -> central
#   - any tenant subdomain    (e.g. acme.example.com, acme.localhost) -> tenant
#
# The tenant is resolved by the BACKEND from the Host header (stancl/tenancy),
# so nginx's only job is to pass the original Host through unchanged to both the
# Next.js frontend and the Laravel API. A single server block with a wildcard
# `server_name` matches the apex and every subdomain.
#
# Routing within a host:
#   /api/*            -> Laravel API   (backend:8000)
#   everything else   -> Next.js app   (frontend:3000)
#
# This mirrors production: put a wildcard DNS record `*.example.com` (and the
# apex) in front of this proxy, terminate TLS here, and every tenant subdomain
# plus the platform console at the apex are served by the same stack.

upstream frontend_upstream {
    server frontend:3000;
}

upstream backend_upstream {
    # `api` is the Laravel service name in docker-compose.yml.
    server api:8000;
}

server {
    listen 80;
    # Match the apex AND any single-level subdomain for both the demo
    # (localhost) and a real domain. Add your production domain here.
    server_name localhost *.localhost example.com *.example.com;

    # Allow large-ish uploads (logos, imports) without 413s.
    client_max_body_size 25m;

    # ── API -> Laravel ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Preserve the ORIGINAL host so the backend resolves the right tenant
        # (or recognizes the central/apex host). This is the crux of wildcard
        # multi-tenant routing.
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_read_timeout 120s;
    }

    # Laravel health probe + Sanctum csrf live under their own paths; route the
    # common ones to the backend too.
    location = /up {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    # ── Everything else -> Next.js ───────────────────────────────────────────
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;

        # WebSocket/HMR upgrade support (dev) + normal requests.
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         "upgrade";

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $host;

        proxy_read_timeout 120s;
    }
}
